<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmTrace - Agricultural Supply Chain</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .navbar { background: #2c3e50; color: white; padding: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .dashboard { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        .sidebar { background: white; padding: 1.5rem; border-radius: 8px; }
        .sidebar button { display: block; width: 100%; padding: 0.75rem; margin: 0.5rem 0; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .sidebar button:hover { background: #2980b9; }
        .content { background: white; padding: 2rem; border-radius: 8px; }
        .form-group { margin: 1rem 0; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 0.75rem 1.5rem; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #229954; }
        .success { background: #d4edda; color: #155724; padding: 1rem; border-radius: 4px; margin: 1rem 0; }
        .warning { background: #fff3cd; color: #856404; padding: 1rem; border-radius: 4px; margin: 1rem 0; }
        .danger { background: #f8d7da; color: #721c24; padding: 1rem; border-radius: 4px; margin: 1rem 0; }
        .health-score { font-size: 2rem; font-weight: bold; text-align: center; padding: 1rem; border-radius: 8px; }
        .health-excellent { background: #d4edda; color: #155724; }
        .health-good { background: #cfe2ff; color: #084298; }
        .health-fair { background: #fff3cd; color: #664d03; }
        .health-poor { background: #f8d7da; color: #842029; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { border: 1px solid #ddd; padding: 0.75rem; text-align: left; }
        th { background: #f8f9fa; font-weight: bold; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🌾 FarmTrace - Blockchain Supply Chain Transparency</h1>
    </div>

    <div id="root"></div>

    <script src="app.js"></script>
</body>
</html>
